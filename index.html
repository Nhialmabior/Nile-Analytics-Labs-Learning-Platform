<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nile Analytics Labs offers practical learning in Excel, Stata, R programming and SPSS for data analysis and research." />
    <meta name="theme-color" content="#062b3d" />
    <meta name="application-name" content="Nile Analytics Labs" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nile Analytics Labs" />
    <meta property="og:title" content="Nile Analytics Labs | Analyze today, solve tomorrow." />
    <meta property="og:description" content="Build practical data analysis and statistical computing skills with Nile Analytics Labs." />
    <meta property="og:url" content="https://nhialmabior.github.io/Nile-Analytics-Labs-Learning-Platform/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=3" />
    <link rel="manifest" type="application/manifest+json" href="/Nile-Analytics-Labs-Learning-Platform/site.webmanifest" />
    <link rel="canonical" href="https://nhialmabior.github.io/Nile-Analytics-Labs-Learning-Platform/" />
    <title>Nile Analytics Labs | Analyze today, solve tomorrow.</title>
    <style>
      #nile-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f7fafb;opacity:1;visibility:visible;transition:opacity 420ms ease,visibility 420ms ease}
      #nile-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .nile-loader-content{display:flex;flex-direction:column;align-items:center;gap:11px;transform:translateY(-4px)}
      .nile-loader-mark{width:58px;height:58px;display:grid;place-items:center;overflow:hidden;border-radius:16px;background:#0b1f3a;box-shadow:0 8px 24px rgba(6,43,61,.14)}
      .nile-loader-mark svg{width:43px;height:43px;overflow:visible}
      .nile-loader-wave{fill:none;stroke:#fff;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 7;animation:nile-river-flow 1.35s linear infinite}
      .nile-loader-wave:nth-child(2){animation-duration:1.65s;animation-delay:-.35s;opacity:.9}
      .nile-loader-wave:nth-child(3){animation-duration:1.5s;animation-delay:-.7s;opacity:.82}
      .nile-loader-name{margin:3px 0 0;color:#062b3d;font:800 12px/1.2 Manrope,Arial,sans-serif;letter-spacing:1.45px}
      .nile-loader-tagline{margin:-6px 0 0;color:#647984;font:500 10px/1.4 'DM Sans',Arial,sans-serif;letter-spacing:.25px}
      .nile-loader-track{width:54px;height:2px;margin-top:5px;overflow:hidden;border-radius:4px;background:#dfe9ed}
      .nile-loader-track:after{content:'';display:block;width:22px;height:100%;border-radius:inherit;background:#087fb1;animation:nile-loader-progress 1.15s ease-in-out infinite}
      @keyframes nile-river-flow{to{stroke-dashoffset:-38px}}
      @keyframes nile-loader-progress{from{transform:translateX(-24px)}to{transform:translateX(58px)}}
      @media(prefers-reduced-motion:reduce){.nile-loader-wave,.nile-loader-track:after{animation:none}.nile-loader-wave{stroke-dasharray:none}#nile-loader{transition:none}}
    </style>
    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem('spa-redirect')
          if (redirect) {
            sessionStorage.removeItem('spa-redirect')
            window.history.replaceState(null, '', redirect)
          }
        } catch (error) {
          console.warn('SPA redirect restoration was unavailable.', error)
        }
      })()
    </script>
  </head>
  <body>
    <div id="nile-loader" role="status" aria-label="Loading Nile Analytics Labs">
      <div class="nile-loader-content">
        <div class="nile-loader-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path class="nile-loader-wave" d="M5 14c2 1.7 3.2 2.4 6.5 2.4 7 0 7-5.5 14-5.5 3.5 0 5.3 1.3 7 2.7"/>
            <path class="nile-loader-wave" d="M5 24c2 1.7 3.2 2.4 6.5 2.4 7 0 7-5.5 14-5.5 3.5 0 5.3 1.3 7 2.7"/>
            <path class="nile-loader-wave" d="M5 34c2 1.7 3.2 2.4 6.5 2.4 7 0 7-5.5 14-5.5 3.5 0 5.3 1.3 7 2.7"/>
          </svg>
        </div>
        <p class="nile-loader-name">NILE ANALYTICS LABS</p>
        <p class="nile-loader-tagline">Analyze today, solve tomorrow</p>
        <span class="nile-loader-track" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root')
        var loader = document.getElementById('nile-loader')
        if (!root || !loader) return
        var observer = new MutationObserver(function () {
          if (!root.hasChildNodes()) return
          observer.disconnect()
          loader.classList.add('is-hidden')
          window.setTimeout(function () { loader.remove() }, 450)
        })
        observer.observe(root, { childList: true })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
